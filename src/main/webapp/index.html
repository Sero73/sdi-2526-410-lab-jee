<html lang="en">
<head>
    <title>Servlets</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384
FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</head>

<body>

<!-- Contenido -->
<div class="container" id="contenedor-principal">
    <h2>Formulario GET Saludar</h2>

    <form action="GreetingServlet" method="get">
        <div class="form-group">
            <label for="name-get">Nombre</label>
            <input type="text" class="form-control" name="name" id="name-get">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <h2>Formulario POST</h2>

    <form action="GreetingServlet" method="post">
        <div class="form-group">
            <label for="name-post">Nombre</label>
            <input type="text" class="form-control" name="name" id="name-post">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

</body>
</html>
